name: Terraform IaC Validation

on:
  push:
    branches: [main, master]
    paths:
      - 'infrastructure/terraform/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'infrastructure/terraform/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-quality:
    name: Terraform Quality & Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.0'

      - name: Verify Terraform Formatting
        run: terraform fmt -check -recursive infrastructure/terraform/

      - name: Initialize Terraform Local Validation
        run: |
          cd infrastructure/terraform/environments/local
          terraform init -backend=false
          terraform validate

      - name: Run Checkov IaC Security Check
        uses: bridgecrewio/checkov-action@master
        with:
          directory: infrastructure/terraform/
          framework: terraform
          output_format: cli
          soft_fail: false
