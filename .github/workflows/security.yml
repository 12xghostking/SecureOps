name: DevSecOps Security Scanning

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 2 * * 1' # Every Monday at 02:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secret-detection:
    name: Gitleaks Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: ${{ hashFiles('.gitleaks.toml') != '' && '.gitleaks.toml' || '' }}

  sast-semgrep:
    name: Semgrep Static Code Analysis
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep:latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: |
          if [ -f "security/semgrep/semgrep-rules.yml" ]; then
            echo "[INFO] Using repository semgrep security rules..."
            semgrep scan --config security/semgrep/semgrep-rules.yml --config auto --sarif --output semgrep-results.sarif .
          else
            echo "[INFO] Running auto semgrep scan..."
            semgrep scan --config auto --sarif --output semgrep-results.sarif .
          fi

      - name: Upload Semgrep SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        continue-on-error: true

  sca-and-container-trivy:
    name: Trivy Vulnerability & Container Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          config: ${{ hashFiles('security/trivy/trivy.yaml') != '' && 'security/trivy/trivy.yaml' || '' }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif
        continue-on-error: true

  iac-checkov:
    name: Checkov Infrastructure-as-Code Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Checkov Scanner
        uses: bridgecrewio/checkov-action@master
        with:
          config_file: ${{ hashFiles('security/checkov/.checkov.yml') != '' && 'security/checkov/.checkov.yml' || '' }}
          output_format: sarif
          output_file_path: checkov-results.sarif
          framework: terraform,kubernetes,dockerfile

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-results.sarif
        continue-on-error: true

  security-gate-enforcement:
    name: Enforce Production Security Gate
    needs: [secret-detection, sast-semgrep, sca-and-container-trivy, iac-checkov]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Security Gate Verification
        run: |
          if [ -f "scripts/security-gate.sh" ]; then
            chmod +x scripts/security-gate.sh
            ./scripts/security-gate.sh Production
          elif [ -f "security-gate.sh" ]; then
            chmod +x security-gate.sh
            ./security-gate.sh Production
          else
            echo "[INFO] No standalone security-gate.sh found. All preceding security scanning jobs evaluated successfully."
          fi
