apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: secureops-ingress
  namespace: secureops
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - secureops.internal
      secretName: secureops-tls-cert
  rules:
    - host: secureops.internal
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: secureops-api
                port:
                  number: 5000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: secureops-web
                port:
                  number: 80
