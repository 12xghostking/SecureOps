apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: secureops
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: secureops
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-ingress
  namespace: secureops
spec:
  podSelector:
    matchLabels:
      app: secureops-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    # Allow web to proxy /api requests to secureops-api
    - to:
        - podSelector:
            matchLabels:
              app: secureops-api
      ports:
        - protocol: TCP
          port: 5000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-traffic
  namespace: secureops
spec:
  podSelector:
    matchLabels:
      app: secureops-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only allow ingress from frontend web pods
    - from:
        - podSelector:
            matchLabels:
              app: secureops-web
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow egress to PostgreSQL and Redis
    - to:
        - podSelector:
            matchLabels:
              app: secureops-postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - podSelector:
            matchLabels:
              app: secureops-redis
      ports:
        - protocol: TCP
          port: 6379
