apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureops-api-hpa
  namespace: secureops
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureops-api
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: secureops-api-pdb
  namespace: secureops
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: secureops-api
