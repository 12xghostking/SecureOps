version: '3.8'

services:
  secureops-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secureops-api
    restart: unless-stopped
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - DatabaseProvider=PostgreSQL
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=secureops;Username=postgres;Password=postgres_secureops_2026!
      - CorsOrigins__0=http://localhost:3000
      - CorsOrigins__1=http://localhost:5173
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.75'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - secureops-net

  secureops-web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secureops-web
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      secureops-api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - secureops-net

  postgres:
    image: postgres:16-alpine
    container_name: secureops-postgres
    restart: unless-stopped
    ports:
      - "5433:5432" # Mapped to 5433 to prevent conflict with local Windows PostgreSQL service
    environment:
      POSTGRES_DB: secureops
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secureops_2026!
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d secureops"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - secureops-net

  redis:
    image: redis:7-alpine
    container_name: secureops-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - secureops-net

volumes:
  postgres_data:
    driver: local

networks:
  secureops-net:
    driver: bridge
